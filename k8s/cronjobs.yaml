# Kubernetes CronJob manifests for scheduled agents
# Deploy to the sovereign node namespace after agents are running.
# Usage: kubectl apply -f k8s/cronjobs.yaml -n soc-platform
#
# Note: These work on the lightweight stack (no SAO dependency).
# At SAO migration: no changes needed — SAO does not manage CronJobs.

---
# Compliance Agent — continuous monitoring every 4 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-continuous
  namespace: soc-platform
  labels:
    app: soc-compliance
    mode: continuous
spec:
  schedule: "0 */4 * * *"       # Every 4 hours
  concurrencyPolicy: Forbid      # Never overlap runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800  # 30 min hard limit
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: soc-agent  # IRSA on AWS
          containers:
          - name: trigger
            image: python:3.11-slim
            command:
            - python
            - -c
            - |
              import httpx, os, json

              AGENT_URL  = os.environ["COMPLIANCE_AGENT_URL"]
              TENANT_IDS = os.environ["TENANT_IDS"].split(",")

              for tenant_id in TENANT_IDS:
                  if not tenant_id.strip():
                      continue
                  r = httpx.post(f"{AGENT_URL}/jobs", json={
                      "tenant_id":  tenant_id.strip(),
                      "mode":       "continuous",
                      "framework_id":"ID_PDP_OJK",
                  }, timeout=300.0)
                  r.raise_for_status()
                  print(f"Compliance job submitted for {tenant_id}: {r.json()}")
            env:
            - name: COMPLIANCE_AGENT_URL
              value: "http://soc-compliance:8082"
            - name: TENANT_IDS
              valueFrom:
                configMapKeyRef:
                  name: soc-config
                  key: tenant_ids
            resources:
              requests: {cpu: "50m", memory: "64Mi"}
              limits:   {cpu: "100m", memory: "128Mi"}

